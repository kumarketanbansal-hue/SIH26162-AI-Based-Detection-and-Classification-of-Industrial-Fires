services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sih_fire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed_data.sql:/docker-entrypoint-initdb.d/seed_data.sql

volumes:
  postgres_data:
